<svg viewBox="0 0 340 200" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Background gradient -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4A574;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B8860B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0E27;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1f3a;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background split -->
  <rect width="340" height="100" fill="url(#grad1)"/>
  <rect y="100" width="340" height="100" fill="url(#grad2)"/>
  
  <!-- Building icon -->
  <g transform="translate(50, 20)">
    <rect x="10" y="30" width="70" height="50" fill="#0A0E27" stroke="#D4A574" stroke-width="2"/>
    <rect x="20" y="40" width="12" height="12" fill="#D4A574"/>
    <rect x="38" y="40" width="12" height="12" fill="#D4A574"/>
    <rect x="56" y="40" width="12" height="12" fill="#D4A574"/>
    <rect x="20" y="58" width="12" height="12" fill="#D4A574"/>
    <rect x="38" y="58" width="12" height="12" fill="#D4A574"/>
    <rect x="56" y="58" width="12" height="12" fill="#D4A574"/>
    <polygon points="45,25 25,35 65,35" fill="#D4A574"/>
  </g>
  
  <!-- Project Code Badge -->
  <rect x="220" y="15" width="110" height="35" rx="5" fill="#D4A574"/>
  <text x="275" y="40" font-size="18" font-weight="bold" fill="#0A0E27" text-anchor="middle" font-family="Arial">SD-P153</text>
  
  <!-- Project Name -->
  <text x="20" y="125" font-size="14" font-weight="bold" fill="#FFFFFF" font-family="Arial">Saeed Kharbash Residence</text>
  
  <!-- Owner -->
  <text x="20" y="150" font-size="11" fill="#B8860B" font-family="Arial">Owner: Saeed Kharbash</text>
  
  <!-- Status badge -->
  <rect x="20" y="160" width="80" height="22" rx="4" fill="rgba(122, 204, 45, 0.3)" stroke="#7acc2d" stroke-width="1"/>
  <text x="60" y="177" font-size="10" font-weight="bold" fill="#7acc2d" text-anchor="middle" font-family="Arial">Construction</text>
</svg>
