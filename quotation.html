<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SKOON - Request Quotation</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .quotation-container {
      max-width: 900px;
      margin: 0 auto;
      padding: 2rem;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }

    .btn-back {
      padding: 0.6rem 1.2rem;
      background: var(--bg-card);
      color: var(--primary);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      text-decoration: none;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
    }

    .btn-back:hover {
      background: var(--border);
    }

    .lang-toggle {
      background: var(--primary);
      color: #000;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: var(--radius);
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
    }

    .lang-toggle:hover {
      background: var(--primary-dark);
    }

    .btn-logout {
      padding: 0.6rem 1.2rem;
      background: var(--danger);
      color: white;
      border: none;
      border-radius: var(--radius);
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
    }

    .btn-logout:hover {
      background: #c73939;
    }

    .form-container {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 2rem;
    }

    .form-header {
      margin-bottom: 2rem;
      border-bottom: 2px solid var(--border);
      padding-bottom: 1rem;
    }

    .form-header h1 {
      color: var(--text-primary);
      margin: 0;
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
    }

    .form-header p {
      color: var(--text-secondary);
      margin: 0;
    }

    .form-section {
      margin-bottom: 2rem;
    }

    .section-title {
      color: var(--text-primary);
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 1rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--border);
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .form-row.full {
      grid-template-columns: 1fr;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .form-group label {
      color: var(--text-primary);
      font-weight: 600;
      margin-bottom: 0.5rem;
      font-size: 0.95rem;
    }

    .form-group label .required {
      color: var(--danger);
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      padding: 0.75rem 1rem;
      background: var(--bg-light);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text-primary);
      font-family: inherit;
      font-size: 1rem;
      transition: var(--transition);
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(212, 165, 116, 0.1);
    }

    .form-group textarea {
      resize: vertical;
      min-height: 120px;
    }

    .form-help {
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-top: 0.35rem;
    }

    .form-group.checkbox {
      flex-direction: row;
      align-items: center;
      gap: 0.75rem;
    }

    .form-group.checkbox input {
      width: 20px;
      height: 20px;
      margin: 0;
    }

    .form-group.checkbox label {
      margin-bottom: 0;
    }

    .line-items {
      margin-bottom: 1.5rem;
    }

    .line-item {
      display: grid;
      grid-template-columns: 1fr 100px 100px;
      gap: 1rem;
      margin-bottom: 1rem;
      padding: 1rem;
      background: var(--bg-light);
      border-radius: var(--radius);
      align-items: end;
    }

    .line-item input {
      padding: 0.6rem 0.8rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text-primary);
      font-size: 0.9rem;
    }

    .btn-add-line {
      padding: 0.75rem 1.5rem;
      background: var(--bg-light);
      color: var(--primary);
      border: 1px dashed var(--primary);
      border-radius: var(--radius);
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      margin-bottom: 1rem;
    }

    .btn-add-line:hover {
      background: rgba(212, 165, 116, 0.1);
    }

    .summary-box {
      background: linear-gradient(135deg, var(--bg-light) 0%, var(--border) 100%);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
      font-size: 1rem;
    }

    .summary-row.total {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--primary);
      border-top: 1px solid var(--border);
      padding-top: 1rem;
      margin-top: 1rem;
    }

    .summary-label {
      color: var(--text-secondary);
    }

    .summary-value {
      color: var(--text-primary);
      font-weight: 600;
    }

    .button-group {
      display: flex;
      gap: 1rem;
      justify-content: flex-end;
      margin-top: 2rem;
      padding-top: 2rem;
      border-top: 1px solid var(--border);
    }

    .btn-cancel {
      padding: 0.75rem 1.5rem;
      background: var(--bg-light);
      color: var(--text-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
    }

    .btn-cancel:hover {
      background: var(--border);
    }

    .btn-submit {
      padding: 0.75rem 2rem;
      background: var(--primary);
      color: #000;
      border: none;
      border-radius: var(--radius);
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      font-size: 1rem;
    }

    .btn-submit:hover {
      background: var(--primary-dark);
      transform: translateY(-2px);
    }

    .success-message {
      display: none;
      padding: 1.5rem;
      background: rgba(122, 204, 45, 0.2);
      color: #7acc2d;
      border: 1px solid #7acc2d;
      border-radius: var(--radius-lg);
      margin-bottom: 2rem;
    }

    .success-message.show {
      display: block;
    }

    @media (max-width: 768px) {
      .quotation-container {
        padding: 1rem;
      }

      .form-container {
        padding: 1.5rem;
      }

      .form-row {
        grid-template-columns: 1fr;
      }

      .line-item {
        grid-template-columns: 1fr;
      }

      .button-group {
        flex-direction: column;
        justify-content: stretch;
      }

      .btn-cancel,
      .btn-submit {
        width: 100%;
      }

      .top-bar {
        flex-direction: column;
        align-items: stretch;
      }
    }
  </style>
</head>
<body id="quotation-page">
  <div class="quotation-container">
    <!-- Top Navigation -->
    <div class="top-bar">
      <a href="#" class="btn-back" onclick="history.back(); return false;" data-i18n="common_back">← Back</a>
      
      <div style="display: flex; gap: 1rem;">
        <button class="lang-toggle" onclick="toggleLanguage()" data-i18n="common_language">العربية</button>
        <button class="btn-logout" onclick="logout()" data-i18n="common_logout">Logout</button>
      </div>
    </div>

    <!-- Success Message -->
    <div class="success-message" id="success-msg">
      ✅ Quotation request submitted successfully! We'll contact you soon.
    </div>

    <!-- Form -->
    <div class="form-container">
      <div class="form-header">
        <h1 data-i18n="quotation_title">Request a Quotation</h1>
        <p data-i18n="quotation_description">Fill out the form below to request a quotation for your project</p>
      </div>

      <form id="quotation-form" onsubmit="handleSubmit(event)">
        <!-- Client Information Section -->
        <div class="form-section">
          <h3 class="section-title" data-i18n="quotation_client_info">Client Information</h3>
          
          <div class="form-row">
            <div class="form-group">
              <label>
                <span data-i18n="common_name">Name</span>
                <span class="required">*</span>
              </label>
              <input type="text" id="client-name" required data-i18n="common_name">
            </div>
            <div class="form-group">
              <label>
                <span data-i18n="common_email">Email</span>
                <span class="required">*</span>
              </label>
              <input type="email" id="client-email" required data-i18n="common_email">
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>
                <span data-i18n="common_phone">Phone</span>
                <span class="required">*</span>
              </label>
              <input type="tel" id="client-phone" required data-i18n="common_phone">
            </div>
            <div class="form-group">
              <label>
                <span data-i18n="common_company">Company</span>
              </label>
              <input type="text" id="client-company" data-i18n="common_company">
            </div>
          </div>
        </div>

        <!-- Project Information Section -->
        <div class="form-section">
          <h3 class="section-title" data-i18n="quotation_project_info">Project Information</h3>
          
          <div class="form-row full">
            <div class="form-group">
              <label>
                <span data-i18n="quotation_project_name">Project Name</span>
                <span class="required">*</span>
              </label>
              <input type="text" id="project-name" required data-i18n="quotation_project_name">
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>
                <span data-i18n="common_location">Location</span>
                <span class="required">*</span>
              </label>
              <input type="text" id="project-location" required data-i18n="common_location">
            </div>
            <div class="form-group">
              <label>
                <span data-i18n="common_area">Area (sqm)</span>
                <span class="required">*</span>
              </label>
              <input type="number" id="project-area" required step="0.01" data-i18n="common_area">
            </div>
          </div>

          <div class="form-row full">
            <div class="form-group">
              <label>
                <span data-i18n="quotation_project_type">Project Type</span>
                <span class="required">*</span>
              </label>
              <select id="project-type" required data-i18n="quotation_project_type">
                <option value="">Select a type...</option>
                <option value="residential">Residential</option>
                <option value="commercial">Commercial</option>
                <option value="industrial">Industrial</option>
                <option value="mixed">Mixed Use</option>
                <option value="infrastructure">Infrastructure</option>
                <option value="other">Other</option>
              </select>
            </div>
          </div>

          <div class="form-row full">
            <div class="form-group">
              <label data-i18n="quotation_description">Project Description</label>
              <textarea id="project-description" placeholder="Describe your project requirements, scope, and any special considerations..."></textarea>
            </div>
          </div>
        </div>

        <!-- Services Section -->
        <div class="form-section">
          <h3 class="section-title" data-i18n="quotation_services">Required Services</h3>
          
          <div class="form-row">
            <div class="form-group checkbox">
              <input type="checkbox" id="service-design" value="Architectural Design">
              <label for="service-design" data-i18n="quotation_design">Architectural Design</label>
            </div>
            <div class="form-group checkbox">
              <input type="checkbox" id="service-structural" value="Structural Engineering">
              <label for="service-structural" data-i18n="quotation_structural">Structural Engineering</label>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group checkbox">
              <input type="checkbox" id="service-mep" value="MEP Design">
              <label for="service-mep" data-i18n="quotation_mep">MEP Design (Mechanical, Electrical, Plumbing)</label>
            </div>
            <div class="form-group checkbox">
              <input type="checkbox" id="service-tender" value="Tender Documentation">
              <label for="service-tender" data-i18n="quotation_tender">Tender Documentation</label>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group checkbox">
              <input type="checkbox" id="service-supervision" value="Site Supervision">
              <label for="service-supervision" data-i18n="quotation_supervision">Site Supervision</label>
            </div>
            <div class="form-group checkbox">
              <input type="checkbox" id="service-pm" value="Project Management">
              <label for="service-pm" data-i18n="quotation_management">Project Management</label>
            </div>
          </div>
        </div>

        <!-- Timeline Section -->
        <div class="form-section">
          <h3 class="section-title" data-i18n="quotation_timeline">Timeline</h3>
          
          <div class="form-row">
            <div class="form-group">
              <label>
                <span data-i18n="quotation_start">Start Date</span>
                <span class="required">*</span>
              </label>
              <input type="date" id="start-date" required data-i18n="quotation_start">
            </div>
            <div class="form-group">
              <label>
                <span data-i18n="quotation_duration">Estimated Duration</span>
                <span class="required">*</span>
              </label>
              <input type="text" id="duration" placeholder="e.g., 6 months" required data-i18n="quotation_duration">
            </div>
          </div>
        </div>

        <!-- Budget Section -->
        <div class="form-section">
          <h3 class="section-title" data-i18n="quotation_budget">Budget Range</h3>
          
          <div class="form-row">
            <div class="form-group">
              <label>
                <span data-i18n="quotation_budget_min">Minimum Budget (AED)</span>
              </label>
              <input type="number" id="budget-min" step="1000" placeholder="e.g., 50000" data-i18n="quotation_budget_min">
            </div>
            <div class="form-group">
              <label>
                <span data-i18n="quotation_budget_max">Maximum Budget (AED)</span>
              </label>
              <input type="number" id="budget-max" step="1000" placeholder="e.g., 100000" data-i18n="quotation_budget_max">
            </div>
          </div>
        </div>

        <!-- Additional Information -->
        <div class="form-section">
          <h3 class="section-title" data-i18n="quotation_additional">Additional Information</h3>
          
          <div class="form-row full">
            <div class="form-group">
              <label data-i18n="quotation_notes">Special Requirements or Notes</label>
              <textarea id="additional-notes" placeholder="Any additional information you'd like us to know..."></textarea>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group checkbox">
              <input type="checkbox" id="agree-terms" required>
              <label for="agree-terms" data-i18n="quotation_agree">I agree to be contacted regarding this quotation request</label>
            </div>
          </div>
        </div>

        <!-- Form Buttons -->
        <div class="button-group">
          <button type="button" class="btn-cancel" onclick="resetForm()" data-i18n="common_clear">Clear</button>
          <button type="submit" class="btn-submit" data-i18n="quotation_submit">Submit Request</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    // Initialize
    const urlParams = new URLSearchParams(window.location.search);
    const langParam = urlParams.get('lang');
    if (langParam) currentLanguage = langParam;

    // Check authentication
    if (!authService.isLoggedIn()) {
      window.location.href = authService.isEmployee() ? 'employee-login.html' : 'client-login.html';
    }

    setLanguage(currentLanguage);

    // Add translations
    translations.en.quotation_title = 'Request a Quotation';
    translations.en.quotation_description = 'Fill out the form below to request a quotation for your project';
    translations.en.quotation_client_info = 'Client Information';
    translations.en.quotation_project_info = 'Project Information';
    translations.en.quotation_project_name = 'Project Name';
    translations.en.quotation_project_type = 'Project Type';
    translations.en.quotation_description = 'Project Description';
    translations.en.quotation_services = 'Required Services';
    translations.en.quotation_design = 'Architectural Design';
    translations.en.quotation_structural = 'Structural Engineering';
    translations.en.quotation_mep = 'MEP Design (Mechanical, Electrical, Plumbing)';
    translations.en.quotation_tender = 'Tender Documentation';
    translations.en.quotation_supervision = 'Site Supervision';
    translations.en.quotation_management = 'Project Management';
    translations.en.quotation_timeline = 'Timeline';
    translations.en.quotation_start = 'Start Date';
    translations.en.quotation_duration = 'Estimated Duration';
    translations.en.quotation_budget = 'Budget Range';
    translations.en.quotation_budget_min = 'Minimum Budget (AED)';
    translations.en.quotation_budget_max = 'Maximum Budget (AED)';
    translations.en.quotation_additional = 'Additional Information';
    translations.en.quotation_notes = 'Special Requirements or Notes';
    translations.en.quotation_agree = 'I agree to be contacted regarding this quotation request';
    translations.en.quotation_submit = 'Submit Request';

    translations.ar.quotation_title = 'طلب عرض سعر';
    translations.ar.quotation_description = 'تعبئة النموذج أدناه لطلب عرض سعر لمشروعك';
    translations.ar.quotation_client_info = 'معلومات العميل';
    translations.ar.quotation_project_info = 'معلومات المشروع';
    translations.ar.quotation_project_name = 'اسم المشروع';
    translations.ar.quotation_project_type = 'نوع المشروع';
    translations.ar.quotation_description = 'وصف المشروع';
    translations.ar.quotation_services = 'الخدمات المطلوبة';
    translations.ar.quotation_design = 'التصميم المعماري';
    translations.ar.quotation_structural = 'الهندسة الإنشائية';
    translations.ar.quotation_mep = 'تصميم الأنظمة الميكانيكية والكهربائية والصحية';
    translations.ar.quotation_tender = 'وثائق التندر';
    translations.ar.quotation_supervision = 'الإشراف على الموقع';
    translations.ar.quotation_management = 'إدارة المشروع';
    translations.ar.quotation_timeline = 'المخطط الزمني';
    translations.ar.quotation_start = 'تاريخ البدء';
    translations.ar.quotation_duration = 'المدة المقدرة';
    translations.ar.quotation_budget = 'نطاق الميزانية';
    translations.ar.quotation_budget_min = 'الحد الأدنى للميزانية (درهم)';
    translations.ar.quotation_budget_max = 'الحد الأقصى للميزانية (درهم)';
    translations.ar.quotation_additional = 'معلومات إضافية';
    translations.ar.quotation_notes = 'متطلبات خاصة أو ملاحظات';
    translations.ar.quotation_agree = 'أوافق على التواصل معي بشأن طلب العرض السعري';
    translations.ar.quotation_submit = 'إرسال الطلب';

    // Pre-fill client info if logged in
    const user = authService.getUser();
    if (user) {
      document.getElementById('client-name').value = user.name || '';
      if (user.email) document.getElementById('client-email').value = user.email;
    }

    // Form submission
    function handleSubmit(e) {
      e.preventDefault();

      // Collect form data
      const formData = {
        clientName: document.getElementById('client-name').value,
        clientEmail: document.getElementById('client-email').value,
        clientPhone: document.getElementById('client-phone').value,
        clientCompany: document.getElementById('client-company').value,
        projectName: document.getElementById('project-name').value,
        projectLocation: document.getElementById('project-location').value,
        projectArea: document.getElementById('project-area').value,
        projectType: document.getElementById('project-type').value,
        projectDescription: document.getElementById('project-description').value,
        services: Array.from(document.querySelectorAll('input[type="checkbox"]:checked')).map(c => c.value),
        startDate: document.getElementById('start-date').value,
        duration: document.getElementById('duration').value,
        budgetMin: document.getElementById('budget-min').value,
        budgetMax: document.getElementById('budget-max').value,
        additionalNotes: document.getElementById('additional-notes').value,
        submittedAt: new Date().toISOString()
      };

      // Save to localStorage (in real app, would send to server)
      const quotations = JSON.parse(localStorage.getItem('quotations') || '[]');
      quotations.push(formData);
      localStorage.setItem('quotations', JSON.stringify(quotations));

      // Show success message
      document.getElementById('success-msg').classList.add('show');
      
      // Reset form
      setTimeout(() => {
        document.getElementById('quotation-form').reset();
        document.getElementById('success-msg').classList.remove('show');
      }, 3000);

      console.log('Quotation submitted:', formData);
    }

    function resetForm() {
      document.getElementById('quotation-form').reset();
    }
  </script>
</body>
</html>
