<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SKOON - Employee Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .dashboard-container {
      display: grid;
      grid-template-columns: 1fr;
      gap: 2rem;
      padding: 2rem;
      max-width: 1400px;
      margin: 0 auto;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 1.5rem;
      border-radius: var(--radius-lg);
    }

    .header-info h1 {
      color: var(--text-primary);
      margin-bottom: 0.25rem;
    }

    .header-info p {
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    .header-actions {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .btn-action {
      padding: 0.6rem 1.2rem;
      background: var(--primary);
      color: #000;
      border: none;
      border-radius: var(--radius);
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      font-size: 0.9rem;
    }

    .btn-action:hover {
      background: var(--primary-dark);
      transform: translateY(-2px);
    }

    .filters-bar {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 1rem;
      border-radius: var(--radius-lg);
    }

    .filter-group {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .filter-group label {
      color: var(--text-secondary);
      font-weight: 500;
      font-size: 0.9rem;
    }

    .filter-group select {
      padding: 0.5rem 0.75rem;
      background: var(--bg-light);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text-primary);
      font-size: 0.9rem;
    }

    .filter-group select:focus {
      outline: none;
      border-color: var(--primary);
    }

    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.5rem;
    }

    .project-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      transition: var(--transition);
    }

    .project-card:hover {
      border-color: var(--primary);
      box-shadow: 0 8px 24px rgba(212, 165, 116, 0.15);
      transform: translateY(-4px);
    }

    .project-image {
      width: 100%;
      height: 200px;
      background: linear-gradient(135deg, var(--bg-light) 0%, var(--bg-lighter) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    .project-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .project-image::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(135deg, rgba(212, 165, 116, 0.1) 0%, transparent 100%);
      pointer-events: none;
    }

    .project-code {
      position: absolute;
      top: 1rem;
      left: 1rem;
      background: var(--primary);
      color: #000;
      padding: 0.4rem 0.8rem;
      border-radius: var(--radius);
      font-weight: 700;
      font-size: 0.85rem;
    }

    html[lang="ar"] .project-code {
      left: auto;
      right: 1rem;
    }

    .project-info {
      padding: 1.5rem;
    }

    .project-name {
      color: var(--text-primary);
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .project-meta {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .project-meta-item {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      color: var(--text-secondary);
    }

    .project-meta-item strong {
      color: var(--text-primary);
    }

    .project-description {
      color: var(--text-secondary);
      font-size: 0.85rem;
      margin-bottom: 1rem;
      line-height: 1.5;
    }

    .project-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
    }

    .status-badge {
      display: inline-block;
      padding: 0.4rem 0.8rem;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .status-construction {
      background: rgba(99, 153, 34, 0.2);
      color: #7acc2d;
    }

    .status-tender {
      background: rgba(186, 117, 23, 0.2);
      color: #ffa500;
    }

    .status-contract {
      background: rgba(212, 165, 116, 0.2);
      color: var(--primary);
    }

    .btn-view {
      padding: 0.5rem 1rem;
      background: var(--primary);
      color: #000;
      border: none;
      border-radius: var(--radius);
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: var(--transition);
    }

    .btn-view:hover {
      background: var(--primary-dark);
    }

    .stats-section {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 1.5rem;
      border-radius: var(--radius-lg);
      text-align: center;
    }

    .stat-number {
      font-size: 2rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 0.25rem;
    }

    .stat-label {
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }

    .search-box {
      flex: 1;
      min-width: 250px;
      padding: 0.75rem 1rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text-primary);
      font-size: 0.9rem;
    }

    .search-box::placeholder {
      color: var(--text-muted);
    }

    .search-box:focus {
      outline: none;
      border-color: var(--primary);
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
    }

    .user-avatar {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
      font-weight: 700;
      font-size: 1rem;
    }

    .user-details {
      display: flex;
      flex-direction: column;
    }

    .user-name {
      color: var(--text-primary);
      font-weight: 600;
      font-size: 0.95rem;
    }

    .user-role {
      color: var(--text-secondary);
      font-size: 0.8rem;
    }

    .btn-logout {
      padding: 0.6rem 1.2rem;
      background: var(--danger);
      color: white;
      border: none;
      border-radius: var(--radius);
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
    }

    .btn-logout:hover {
      background: #c73939;
    }

    .lang-toggle {
      background: var(--primary);
      color: #000;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: var(--radius);
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
    }

    .lang-toggle:hover {
      background: var(--primary-dark);
    }

    @media (max-width: 768px) {
      .projects-grid {
        grid-template-columns: 1fr;
      }

      .dashboard-container {
        padding: 1rem;
      }

      .header-bar {
        flex-direction: column;
        align-items: flex-start;
      }

      .top-bar {
        flex-direction: column;
        align-items: stretch;
      }

      .search-box {
        min-width: 100%;
      }
    }
  </style>
</head>
<body id="dashboard-employee">
  <div class="dashboard-container">
    <!-- Top Navigation -->
    <div class="top-bar">
      <input type="text" class="search-box" id="search-input" placeholder="Search projects..." data-i18n="common_search">
      
      <div style="display: flex; gap: 1rem;">
        <button class="lang-toggle" onclick="toggleLanguage()" data-i18n="common_language">العربية</button>
        
        <div class="user-info">
          <div class="user-avatar" id="user-avatar">SK</div>
          <div class="user-details">
            <div class="user-name" id="user-name">User Name</div>
            <div class="user-role" id="user-role">Employee</div>
          </div>
        </div>

        <button class="btn-logout" onclick="logout()" data-i18n="common_logout">Logout</button>
      </div>
    </div>

    <!-- Header Section -->
    <div class="header-bar">
      <div class="header-info">
        <h1 data-i18n="dashboard_welcome">Welcome</h1>
        <p id="greeting" data-i18n="dashboard_employees">Employee Portal - All Projects</p>
      </div>
    </div>

    <!-- Stats Section -->
    <div class="stats-section">
      <div class="stat-card">
        <div class="stat-number" id="total-projects">9</div>
        <div class="stat-label" data-i18n="dashboard_projects">Total Projects</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="construction-count">6</div>
        <div class="stat-label" data-i18n="dashboard_construction">Under Construction</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="tender-count">1</div>
        <div class="stat-label" data-i18n="dashboard_tender">Tender Stage</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="contract-count">1</div>
        <div class="stat-label" data-i18n="dashboard_contract">Contract Phase</div>
      </div>
    </div>

    <!-- Filters -->
    <div class="filters-bar">
      <div class="filter-group">
        <label data-i18n="common_filter">Filter by:</label>
        <select id="status-filter">
          <option value="">All Projects</option>
          <option value="construction">Under Construction</option>
          <option value="tender">Tender Stage</option>
          <option value="contract">Contract Signing</option>
        </select>
      </div>
      <div class="filter-group">
        <label data-i18n="common_search">Search:</label>
        <input type="text" id="project-search" placeholder="Project code, owner..." style="padding: 0.5rem 0.75rem; background: var(--bg-light); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text-primary);">
      </div>
    </div>

    <!-- Projects Grid -->
    <div class="projects-grid" id="projects-container">
      <!-- Loaded dynamically -->
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    // Initialize
    const urlParams = new URLSearchParams(window.location.search);
    const langParam = urlParams.get('lang');
    if (langParam) currentLanguage = langParam;
    
    // Redirect if not logged in or not employee
    if (!authService.isLoggedIn()) {
      window.location.href = 'employee-login.html';
    }
    
    if (!authService.isEmployee()) {
      window.location.href = 'client-login.html';
    }

    setLanguage(currentLanguage);
    initPage();

    // Update user info
    const user = authService.getUser();
    if (user) {
      document.getElementById('user-name').textContent = user.name;
      document.getElementById('user-avatar').textContent = user.name.charAt(0).toUpperCase();
    }

    // Load all projects
    function renderProjects(projectsToShow = projectsData) {
      const container = document.getElementById('projects-container');
      
      const html = projectsToShow.map(project => `
        <div class="project-card">
          <div class="project-image">
            <span class="project-code">${project.code}</span>
            <img src="project-images/${project.image}" alt="${project.name}" 
                 onerror="this.src='https://via.placeholder.com/320x200?text=${project.code}'">
          </div>
          <div class="project-info">
            <div class="project-name">${project.name}</div>
            <div class="project-meta">
              <div class="project-meta-item">
                <span data-i18n="dashboard_owner">Owner:</span>
                <strong>${project.owner}</strong>
              </div>
              <div class="project-meta-item">
                <span data-i18n="common_area">Area:</span>
                <strong>${project.area}</strong>
              </div>
              <div class="project-meta-item">
                <span data-i18n="common_location">Location:</span>
                <strong>${project.location}</strong>
              </div>
            </div>
            <div class="project-description">${project.description}</div>
            <div class="project-footer">
              <span class="status-badge status-${project.status}">${project.stage}</span>
              <button class="btn-view" onclick="viewProject(${project.id})" data-i18n="dashboard_view_details">View</button>
            </div>
          </div>
        </div>
      `).join('');

      container.innerHTML = html;
      updateStats(projectsToShow);
    }

    // Update statistics
    function updateStats(projects) {
      const construction = projects.filter(p => p.status === 'construction').length;
      const tender = projects.filter(p => p.status === 'tender').length;
      const contract = projects.filter(p => p.status === 'contract').length;

      document.getElementById('total-projects').textContent = projects.length;
      document.getElementById('construction-count').textContent = construction;
      document.getElementById('tender-count').textContent = tender;
      document.getElementById('contract-count').textContent = contract;
    }

    // Filter by status
    document.getElementById('status-filter').addEventListener('change', (e) => {
      const status = e.target.value;
      const filtered = status ? projectsData.filter(p => p.status === status) : projectsData;
      renderProjects(filtered);
    });

    // Search projects
    document.getElementById('project-search').addEventListener('input', (e) => {
      const query = e.target.value.toLowerCase();
      const filtered = projectsData.filter(p => 
        p.code.toLowerCase().includes(query) || 
        p.owner.toLowerCase().includes(query) ||
        p.name.toLowerCase().includes(query)
      );
      renderProjects(filtered);
    });

    // Initial render
    renderProjects();
  </script>
</body>
</html>
