<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SKOON - My Project</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .dashboard-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
    }

    .user-avatar {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
      font-weight: 700;
      font-size: 1rem;
    }

    .user-details {
      display: flex;
      flex-direction: column;
    }

    .user-name {
      color: var(--text-primary);
      font-weight: 600;
      font-size: 0.95rem;
    }

    .user-role {
      color: var(--text-secondary);
      font-size: 0.8rem;
    }

    .btn-logout {
      padding: 0.6rem 1.2rem;
      background: var(--danger);
      color: white;
      border: none;
      border-radius: var(--radius);
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
    }

    .btn-logout:hover {
      background: #c73939;
    }

    .lang-toggle {
      background: var(--primary);
      color: #000;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: var(--radius);
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
    }

    .lang-toggle:hover {
      background: var(--primary-dark);
    }

    .header-section {
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 2rem;
      border-radius: var(--radius-lg);
      margin-bottom: 2rem;
    }

    .header-section h1 {
      color: var(--text-primary);
      margin-bottom: 0.5rem;
    }

    .header-section p {
      color: var(--text-secondary);
      font-size: 0.95rem;
    }

    .project-detail {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      margin-bottom: 2rem;
    }

    .project-image-container {
      width: 100%;
      height: 400px;
      background: linear-gradient(135deg, var(--bg-light) 0%, var(--bg-lighter) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    .project-image-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .project-image-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(135deg, rgba(212, 165, 116, 0.1) 0%, transparent 100%);
      pointer-events: none;
    }

    .project-code-badge {
      position: absolute;
      top: 1.5rem;
      left: 1.5rem;
      background: var(--primary);
      color: #000;
      padding: 0.6rem 1.2rem;
      border-radius: var(--radius);
      font-weight: 700;
      font-size: 1rem;
    }

    html[lang="ar"] .project-code-badge {
      left: auto;
      right: 1.5rem;
    }

    .project-info {
      padding: 2rem;
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1.5rem;
      margin-bottom: 2rem;
    }

    .info-item {
      border-left: 3px solid var(--primary);
      padding-left: 1rem;
    }

    html[lang="ar"] .info-item {
      border-left: none;
      border-right: 3px solid var(--primary);
      padding-left: 0;
      padding-right: 1rem;
    }

    .info-label {
      color: var(--text-secondary);
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      margin-bottom: 0.25rem;
    }

    .info-value {
      color: var(--text-primary);
      font-size: 1.1rem;
      font-weight: 600;
    }

    .description-section {
      background: var(--bg-light);
      padding: 1.5rem;
      border-radius: var(--radius);
      margin-bottom: 1.5rem;
    }

    .description-section h3 {
      color: var(--text-primary);
      margin-bottom: 0.75rem;
    }

    .description-section p {
      color: var(--text-secondary);
      line-height: 1.6;
    }

    .status-section {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1.5rem;
      background: var(--bg-light);
      border-radius: var(--radius);
      margin-top: 1.5rem;
    }

    .status-badge-large {
      padding: 0.75rem 1.5rem;
      border-radius: 20px;
      font-weight: 600;
      font-size: 1rem;
    }

    .status-construction {
      background: rgba(99, 153, 34, 0.2);
      color: #7acc2d;
    }

    .status-tender {
      background: rgba(186, 117, 23, 0.2);
      color: #ffa500;
    }

    .status-contract {
      background: rgba(212, 165, 116, 0.2);
      color: var(--primary);
    }

    .actions-section {
      display: flex;
      gap: 1rem;
      margin-top: 2rem;
    }

    .btn-action {
      flex: 1;
      padding: 0.75rem 1.5rem;
      background: var(--primary);
      color: #000;
      border: none;
      border-radius: var(--radius);
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      font-size: 0.95rem;
    }

    .btn-action:hover {
      background: var(--primary-dark);
      transform: translateY(-2px);
    }

    .btn-secondary {
      background: var(--bg-light);
      color: var(--text-primary);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background: var(--border);
    }

    .documents-section {
      margin-top: 2rem;
      padding: 2rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
    }

    .documents-section h2 {
      color: var(--text-primary);
      margin-bottom: 1rem;
    }

    .no-documents {
      color: var(--text-secondary);
      text-align: center;
      padding: 2rem;
      background: var(--bg-light);
      border-radius: var(--radius);
    }

    @media (max-width: 768px) {
      .dashboard-container {
        padding: 1rem;
      }

      .project-image-container {
        height: 250px;
      }

      .info-grid {
        grid-template-columns: 1fr;
      }

      .top-bar {
        flex-direction: column;
        align-items: stretch;
      }

      .actions-section {
        flex-direction: column;
      }
    }
  </style>
</head>
<body id="dashboard-client">
  <!-- Top Navigation -->
  <div style="background: var(--bg-light); padding: 2rem; border-bottom: 1px solid var(--border);">
    <div class="dashboard-container">
      <div class="top-bar">
        <h1 style="color: var(--primary); margin: 0;" data-i18n="dashboard_my_projects">My Project</h1>
        
        <div style="display: flex; gap: 1rem;">
          <button class="lang-toggle" onclick="toggleLanguage()" data-i18n="common_language">العربية</button>
          
          <div class="user-info">
            <div class="user-avatar" id="user-avatar">C</div>
            <div class="user-details">
              <div class="user-name" id="user-name">Client Name</div>
              <div class="user-role" data-i18n="login_client">Client</div>
            </div>
          </div>

          <button class="btn-logout" onclick="logout()" data-i18n="common_logout">Logout</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Main Content -->
  <div class="dashboard-container">
    <!-- Header -->
    <div class="header-section">
      <h1 id="project-name">Project Name</h1>
      <p data-i18n="dashboard_project_stage">Your Project Details</p>
    </div>

    <!-- Project Detail Card -->
    <div class="project-detail">
      <div class="project-image-container">
        <span class="project-code-badge" id="project-code">SD-P###</span>
        <img id="project-image" src="" alt="Project" 
             onerror="this.src='https://via.placeholder.com/800x400?text=Project+Image'">
      </div>

      <div class="project-info">
        <!-- Project Information Grid -->
        <div class="info-grid">
          <div class="info-item">
            <div class="info-label" data-i18n="dashboard_owner">Owner</div>
            <div class="info-value" id="project-owner">-</div>
          </div>
          <div class="info-item">
            <div class="info-label" data-i18n="common_area">Area</div>
            <div class="info-value" id="project-area">-</div>
          </div>
          <div class="info-item">
            <div class="info-label" data-i18n="common_location">Location</div>
            <div class="info-value" id="project-location">-</div>
          </div>
          <div class="info-item">
            <div class="info-label" data-i18n="common_scope">Scope</div>
            <div class="info-value" id="project-type">-</div>
          </div>
        </div>

        <!-- Description -->
        <div class="description-section">
          <h3 data-i18n="project_title">About This Project</h3>
          <p id="project-description">-</p>
        </div>

        <!-- Status Badge -->
        <div class="status-section">
          <span data-i18n="common_status">Status:</span>
          <span class="status-badge-large status-construction" id="project-status">-</span>
        </div>

        <!-- Actions -->
        <div class="actions-section">
          <button class="btn-action" onclick="alert('Download documents')" data-i18n="common_download">Download Documents</button>
          <button class="btn-action btn-secondary" onclick="alert('Contact SKOON')" data-i18n="dashboard_contact">Contact SKOON</button>
        </div>
      </div>
    </div>

    <!-- Documents Section -->
    <div class="documents-section">
      <h2 data-i18n="project_files">Project Files</h2>
      <div class="no-documents" data-i18n="project_no_files">
        Files will be shared here. Contact SKOON for more information.
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    // Initialize
    const urlParams = new URLSearchParams(window.location.search);
    const langParam = urlParams.get('lang');
    if (langParam) currentLanguage = langParam;
    
    // Redirect if not logged in or not client
    if (!authService.isLoggedIn()) {
      window.location.href = 'client-login.html';
    }
    
    if (!authService.isClient()) {
      window.location.href = 'employee-login.html';
    }

    setLanguage(currentLanguage);

    // Get user and their project
    const user = authService.getUser();
    const project = getProject(user.projectId);

    if (!project) {
      alert('Project not found');
      window.location.href = 'client-login.html';
    }

    // Update page with project data
    document.getElementById('user-name').textContent = user.name;
    document.getElementById('user-avatar').textContent = user.name.charAt(0).toUpperCase();

    document.getElementById('project-name').textContent = project.name;
    document.getElementById('project-code').textContent = project.code;
    document.getElementById('project-owner').textContent = project.owner;
    document.getElementById('project-area').textContent = project.area;
    document.getElementById('project-location').textContent = project.location;
    document.getElementById('project-type').textContent = project.type;
    document.getElementById('project-description').textContent = project.description;
    document.getElementById('project-status').textContent = project.stage;
    document.getElementById('project-status').className = `status-badge-large status-${project.status}`;
    document.getElementById('project-image').src = `project-images/${project.image}`;
  </script>
</body>
</html>
